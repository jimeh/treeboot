name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONS_CACHE_SERVICE_V2: "on"
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  MISE_EXPERIMENTAL: true
  MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - run: mise run actions:lint

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --file Cargo.lock

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - run: mise run format:check

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - run: mise run generate:check
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - run: mise run harness:check
        env:
          TREEBOOT_SPEC_BASE_REF: ${{ github.event.pull_request.base.sha }}

  lint:
    name: lint (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      MISE_RUSTUP_HOME: ${{ startsWith(matrix.runner, 'windows') && format('{0}/.mise-rustup', github.workspace) || '/home/runner/.local/share/mise/rustup' }}
      SCCACHE_GHA_ENABLED: "on"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            task: lint
          - runner: windows-2025
            task: lint:rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --component clippy \
            --component rust-analyzer \
            --component rust-src \
            --component rustfmt
      - run: mise run ${{ matrix.task }}
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - run: mise run msrv
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-npm-{{platform}}-{{file_hash}}
      - run: mise run npm:check

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise-rustup
      SCCACHE_GHA_ENABLED: "on"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
          - windows-2025
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-{{platform}}-{{file_hash}}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --component clippy \
            --component rust-analyzer \
            --component rust-src \
            --component rustfmt
      - run: mise run test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Smoke-test the host npm package
        shell: bash
        run: |
          exe=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe=".exe"
          fi
          mise run npm:build
          bun run npm/scripts/smoke-host.ts \
            "target/debug/treeboot${exe}"

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  standalone-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key: mise-v2-standalone-conformance-{{platform}}-{{file_hash}}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --component clippy \
            --component rust-analyzer \
            --component rust-src \
            --component rustfmt
      - run: mise run test:spec:standalone
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
