name: renovate-mise

on:
  workflow_dispatch:
    inputs:
      bypass-schedule:
        description: >-
          Run Renovate immediately instead of waiting for the monthly window
        type: boolean
        default: true
      log-level:
        description: Renovate log verbosity
        type: choice
        default: info
        options:
          - info
          - debug
  schedule:
    - cron: "17 1,3,5 1 * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate-mise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          LOG_LEVEL: ${{ inputs['log-level'] || 'info' }}
          RENOVATE_BYPASS_SCHEDULE: ${{ inputs['bypass-schedule'] == true }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          configurationFile: .github/renovate-mise.config.js
          token: ${{ steps.app-token.outputs.token }}
