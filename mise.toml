# ------------------------------------------------------------------------------
# Settings
# ------------------------------------------------------------------------------

[settings]
lockfile = true
minimum_release_age = "7d"
minimum_release_age_excludes = ["github:jimeh/treeboot"]
idiomatic_version_file_enable_tools = ["rust"]

[settings.task]
run_auto_install = true

# ------------------------------------------------------------------------------
# Tools
# ------------------------------------------------------------------------------

[tools]
actionlint = "1"
bun = "1.4.0"
lefthook = "2"
markdownlint-cli2 = "0"
pinact = "4"
sccache = "0"
"github:colbymchenry/codegraph" = "1"
"github:jimeh/treeboot" = "0"
shellcheck = "0"
zizmor = "1"

# ------------------------------------------------------------------------------
# Environment
# ------------------------------------------------------------------------------

[env]
RUSTC_WRAPPER = "sccache"

# ------------------------------------------------------------------------------
# Tasks
# ------------------------------------------------------------------------------

# Bootstrap

[tasks.setup]
description = "Set up local development environment"
run = [{ task = "deps" }, { tasks = ["hooks:install", "codegraph:setup"] }]

[tasks.deps]
description = "Fetch Rust and npm dependencies"
run = ["cargo fetch --locked", "mise run npm:deps"]

[tasks."npm:deps"]
description = "Install locked Bun dependencies"
run = "bun install --frozen-lockfile"

[tasks."hooks:install"]
description = "Install lefthook Git hooks"
run = "lefthook install"

[tasks."codegraph:setup"]
description = "Initialize the local CodeGraph index"
run = "codegraph init"

[tasks.treeboot]
description = "Bootstrap the current worktree with treeboot"
run = "treeboot"

# Development

[tasks.format]
depends = ["format:rust", "format:npm"]
description = "Format Rust, TypeScript, JSON, and Markdown files"

[tasks."format:rust"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."format:check"]
depends = ["format:rust:check", "format:npm:check"]
description = "Check formatting without writing changes"

[tasks."format:rust:check"]
description = "Check Rust formatting without writing changes"
run = "cargo fmt --all -- --check"

[tasks."format:markdown"]
description = "Format Markdown files"
depends = ["npm:deps"]
run = "bun x oxfmt \"**/*.md\""

[tasks."format:markdown:check"]
description = "Check Markdown formatting without writing changes"
depends = ["npm:deps"]
run = "bun x oxfmt --check \"**/*.md\""

[tasks."format:npm"]
description = "Format TypeScript, JSON, and Markdown files"
depends = ["npm:deps"]
run = "bun run format"

[tasks."format:npm:check"]
description = "Check TypeScript, JSON, and Markdown formatting"
depends = ["npm:deps"]
run = "bun run format:check"

[tasks.lint]
depends = ["lint:rust", "lint:markdown", "lint:npm"]
description = "Run Rust, TypeScript, and Markdown lints"

[tasks."lint:rust"]
description = "Run Rust lints"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks."lint:fix"]
description = "Apply machine-applicable Rust and TypeScript lint fixes"
depends = ["npm:deps"]
run = [
  "cargo clippy --fix --workspace --all-features --locked",
  "bun run lint:fix",
]

[tasks."lint:npm"]
description = "Lint and type-check npm TypeScript"
depends = ["npm:deps"]
run = ["bun run lint", "bun run typecheck"]

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "markdownlint-cli2 \"**/*.md\""

[tasks."lint:markdown:files"]
description = "Lint selected Markdown files"
depends = ["npm:deps"]
usage = 'arg "<files>" var=#true'
run = '''
#!/usr/bin/env bash
set -euo pipefail

eval "files=(${usage_files?})"
bun x oxfmt --check "${files[@]}"
markdownlint-cli2 "${files[@]}"
'''

# Builds

[tasks.build]
description = "Build all Rust targets"
run = "cargo build --workspace --all-targets --locked"

[tasks."build:release"]
description = "Build optimized release binaries"
run = "cargo build --workspace --release --locked"

[tasks."build:release:target"]
description = "Build an optimized treeboot binary for a target triple"
run = '''
target="${1:?target triple required}"
cargo build -p treeboot --locked --release --target "$target"
'''

# Generated artifacts

[tasks.generate]
description = "Generate checked-in artifacts"
run = ["mise run generate:schema", "mise run generate:metadata"]

[tasks."generate:schema"]
description = "Generate JSON Schema for treeboot config"
run = '''
cargo run -p treeboot-core --example generate_config_schema --locked -- crates/treeboot-spec/assets/treeboot.schema.json
mkdir -p crates/treeboot-core/assets schemas
cp crates/treeboot-spec/assets/treeboot.schema.json crates/treeboot-core/assets/config.schema.json
cp crates/treeboot-spec/assets/treeboot.schema.json schemas/treeboot.schema.json
'''

[tasks."generate:metadata"]
description = "Generate treeboot-core metadata assets"
run = "bash scripts/generate-metadata.sh"

[tasks."generate:check"]
depends = ["generate:schema:check", "generate:metadata:check"]
description = "Fail when generated artifacts are out of date"

[tasks."generate:schema:check"]
description = "Fail when generated JSON Schema is out of date"
run = '''
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
cargo run -p treeboot-core --example generate_config_schema --locked -- "$tmp"
diff -u crates/treeboot-spec/assets/treeboot.schema.json "$tmp"
diff -u crates/treeboot-spec/assets/treeboot.schema.json crates/treeboot-core/assets/config.schema.json
diff -u crates/treeboot-spec/assets/treeboot.schema.json schemas/treeboot.schema.json
'''

[tasks."generate:metadata:check"]
description = "Fail when generated metadata is out of date"
run = "bash scripts/generate-metadata.sh check"

# Tests

[tasks.test]
description = "Run all Rust tests and doctests"
run = [
  "cargo test --all-targets --all-features --locked",
  "cargo test --workspace --doc --all-features --locked",
]

[tasks."test:core"]
description = "Run treeboot-core tests and doctests"
run = [
  "cargo test -p treeboot-core --all-targets --all-features --locked",
  "cargo test -p treeboot-core --doc --all-features --locked",
]

[tasks."test:cli"]
description = "Run treeboot CLI tests"
run = "cargo test -p treeboot --all-targets --all-features --locked"

[tasks."test:spec"]
description = "Run treeboot-spec self-tests"
run = "cargo test -p treeboot-spec --all-targets --all-features --locked"

[tasks."test:conformance"]
description = "Run treeboot-spec against the official Treeboot binary"
run = "cargo test -p treeboot --test conformance --locked"

[tasks."test:spec:standalone"]
description = "Run a copied treeboot-spec binary against a copied Treeboot binary"
run = "bash scripts/test-treeboot-spec-standalone.sh"

[tasks."test:release-helper"]
description = "Run release helper tests"
run = "cargo test -p treeboot-release-helper --all-targets --all-features --locked"

[tasks."npm:build"]
description = "Build the Node.js facade package"
depends = ["npm:deps"]
run = "bun run npm:build"

[tasks."npm:test"]
description = "Run npm distribution tests"
depends = ["npm:build"]
run = "bun run npm:test"

[tasks."npm:pack"]
description = "Build and stage npm release tarballs"
depends = ["npm:build"]
usage = '''
arg "version"
arg "assets_dir" default="dist"
arg "output_dir" default="npm-dist"
'''
run = '''
bun run npm:pack -- \
  --version "${usage_version}" \
  --assets-dir "${usage_assets_dir}" \
  --output-dir "${usage_output_dir}"
'''

[tasks."npm:pack:check"]
description = "Verify staged npm release tarballs"
depends = ["npm:deps"]
usage = 'arg "output_dir" default="npm-dist"'
run = 'bun run npm:pack:check -- --output-dir "${usage_output_dir}"'

[tasks."npm:placeholders"]
description = "Stage inert npm platform placeholders for registry bootstrap"
depends = ["npm:deps"]
usage = 'arg "output_dir" default="npm-dist/placeholders"'
run = '''
bun run npm:pack -- \
  --placeholder \
  --version 0.0.0 \
  --output-dir "${usage_output_dir}"
bun run npm:pack:check -- --output-dir "${usage_output_dir}"
'''

[tasks."npm:check"]
description = "Build, lint, type-check, and test the npm distribution"
depends = ["lint:npm", "npm:test"]

# Coverage

[tasks.coverage]
description = "Run tests and print Rust coverage summary"
tools."cargo:cargo-llvm-cov" = "0.9.0"
run = "cargo llvm-cov --workspace --all-targets --all-features --locked"

[tasks."coverage:missing"]
description = "Show uncovered Rust lines"
tools."cargo:cargo-llvm-cov" = "0.9.0"
run = "cargo llvm-cov --workspace --all-targets --all-features --locked --summary-only --show-missing-lines"

# Validation

[tasks."audit:deps"]
description = "Audit Rust dependencies for security vulnerabilities"
tools."cargo:cargo-audit" = "0.22.2"
run = "cargo audit --file Cargo.lock"

[tasks."audit:deps:ci"]
description = "Audit Rust dependencies with the prebuilt CI binary"
tools."github:RustSec/rustsec[exe=cargo-audit,matching=musl,matching_regex=^cargo-audit-,version_prefix=cargo-audit/v]" = "0.22.2"
run = "cargo audit --file Cargo.lock"

[tasks.check]
depends = [
  "format:check",
  "generate:check",
  "harness:check",
  "lint",
  "npm:check",
  "test",
]
description = "Run normal pre-handoff checks"

[tasks.verify]
description = "Run broad local verification"
run = ["mise run ci", "mise run coverage"]

[tasks.ci]
depends = [
  "actions:lint",
  "audit:deps",
  "format:check",
  "generate:check",
  "harness:check",
  "lint",
  "msrv",
  "npm:check",
  "test",
  "test:spec:standalone",
]
description = "Run all CI checks"

[tasks."ci:sccache:stats"]
description = "Report sccache statistics and warn when writable caching degrades"
run = "bash scripts/show-sccache-stats.sh"

[tasks.msrv]
description = "Check Rust MSRV compatibility"
run = "mise exec rust@1.96.0 -- cargo check --locked"

[tasks."harness:check"]
description = "Check repo harness invariants"
run = "scripts/check-harness.sh"

[tasks.doctor]
description = "Check required local tools"
tools."cargo:cargo-audit" = "0.22.2"
tools."cargo:cargo-llvm-cov" = "0.9.0"
run = [
  "git --version",
  "bun --version",
  "bun x tsc --version",
  "cargo audit --version",
  "cargo --version",
  "cargo llvm-cov --version",
  "mise --version",
  "lefthook version",
]

# GitHub Actions

[tasks."actions:lint:actionlint"]
description = "Lint GitHub Actions workflow syntax"
run = "actionlint -shellcheck shellcheck"

[tasks."actions:lint:pinact"]
description = "Verify GitHub Actions are pinned"
run = "pinact run '-fix=false' -no-api"

[tasks."actions:lint:zizmor"]
description = "Audit GitHub Actions workflow security"
run = "zizmor --offline .github/workflows"

[tasks."actions:lint"]
depends = [
  "actions:lint:actionlint",
  "actions:lint:pinact",
  "actions:lint:zizmor",
]
description = "Run GitHub Actions linters"

# Release packaging

[tasks."release:version"]
description = "Print the release version derived from git describe"
run = "scripts/release-version.sh"

[tasks."release:package:local"]
description = "Build and package the current host release binary into dist/"
run = '''
target="$(rustc -vV | sed -n 's/^host: //p')"
version="$(scripts/release-version.sh)"
cargo build -p treeboot --locked --release --target "$target"
scripts/package-release-asset.sh "$target" "$version" dist
scripts/package-config-schema.sh dist
'''

[tasks."release:cross:build"]
description = "Build a release binary with cross"
tools."github:cross-rs/cross[exe=cross,matching=musl,matching_regex=^cross-]" = "0.2.5"
usage = 'arg "target"'
run = 'cross build -p treeboot --locked --release --target "${usage_target}"'

[tasks."release:cross:test"]
description = "Smoke-test the CLI with cross"
tools."github:cross-rs/cross[exe=cross,matching=musl,matching_regex=^cross-]" = "0.2.5"
usage = 'arg "target"'
run = '''
cross test \
  -p treeboot \
  --locked \
  --release \
  --target "${usage_target}" \
  --test cli
'''

[tasks."release:check"]
description = "Run local release packaging and completion smoke checks"
run = '''
mise run release:package:local
target="$(rustc -vV | sed -n 's/^host: //p')"
exe=""
case "${target}" in
  *windows*) exe=".exe" ;;
esac
mise run npm:build
bun run npm/scripts/smoke-host.ts "target/${target}/release/treeboot${exe}"
for shell in bash zsh fish powershell elvish; do
  cargo run -p treeboot --locked -- completions "$shell" >/dev/null
done
'''

# Cleanup

[tasks.clean]
description = "Remove generated Rust and npm build output"
run = ["cargo clean", "rm -rf npm/treeboot/dist npm-dist"]
