name: renovate-mise

on:
  workflow_dispatch:
    inputs:
      bypass-schedule:
        description: >-
          Run Renovate immediately instead of waiting for the monthly window
        type: boolean
        default: true
      log-level:
        description: Renovate log verbosity
        type: choice
        default: info
        options:
          - info
          - debug
  schedule:
    - cron: "17 1,3,5 1 * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate-mise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        env:
          LOG_LEVEL: ${{ inputs['log-level'] || 'info' }}
          RENOVATE_BYPASS_SCHEDULE: ${{ inputs['bypass-schedule'] == true }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          configurationFile: .github/renovate-mise.config.js
          token: ${{ steps.app-token.outputs.token }}
